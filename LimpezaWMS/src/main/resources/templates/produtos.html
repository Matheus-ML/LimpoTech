<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LimpoTech — Produtos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@600;700&display=swap');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --verde: #0d9488; --verde-escuro: #0f766e; --verde-claro: #ccfbf1;
            --verde-medio: #14b8a6; --branco: #ffffff; --fundo: #f0fdfa;
            --texto: #134e4a; --texto-medio: #374151; --borda: #d1fae5;
            --sombra: 0 2px 12px rgba(13,148,136,0.10); --erro: #ef4444;
        }
        body { font-family: 'Inter', sans-serif; background: var(--fundo); color: var(--texto-medio); min-height: 100vh; }

        nav {
            background: linear-gradient(90deg, var(--verde), var(--verde-escuro));
            padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; height: 60px;
            box-shadow: 0 2px 8px rgba(13,148,136,0.25);
        }
        .nav-logo { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; color: white; text-decoration: none; }
        .nav-logo span { opacity: 0.75; }
        .nav-links { display: flex; gap: 4px; }
        .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .nav-links a:hover, .nav-links a.ativo { background: rgba(255,255,255,0.15); color: white; }
        .nav-usuario { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.85); font-size: 13px; }
        .btn-sair { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .btn-sair:hover { background: rgba(255,255,255,0.25); }

        .container { max-width: 1100px; margin: 0 auto; padding: 36px 24px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .page-title { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; color: var(--texto); }

        .btn { padding: 9px 18px; border-radius: 9px; font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; border: none; transition: opacity 0.2s, transform 0.15s; }
        .btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-primary { background: var(--verde); color: white; }
        .btn-danger  { background: #ef4444; color: white; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        .filtros {
            background: var(--branco); border-radius: 12px; border: 1px solid var(--borda);
            padding: 16px 20px; display: flex; gap: 12px; align-items: center; margin-bottom: 20px;
            box-shadow: var(--sombra);
        }
        .filtros input {
            flex: 1; padding: 9px 14px; border: 1.5px solid var(--borda); border-radius: 8px;
            font-size: 14px; font-family: 'Inter', sans-serif; outline: none; background: var(--fundo);
        }
        .filtros input:focus { border-color: var(--verde-medio); }

        .tabela-wrap { background: var(--branco); border-radius: 14px; border: 1px solid var(--borda); overflow: hidden; box-shadow: var(--sombra); }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--verde-claro); }
        th { text-align: left; padding: 12px 18px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--verde-escuro); }
        td { padding: 13px 18px; font-size: 13px; border-top: 1px solid var(--borda); color: var(--texto-medio); }
        tr:hover td { background: #f9fefe; }

        .estoque-baixo { color: #dc2626; font-weight: 600; }

        .acoes { display: flex; gap: 8px; }
        .vazio { text-align: center; padding: 40px; color: #9ca3af; font-size: 14px; }

        /* Paginação */
        .paginacao { display: flex; justify-content: center; gap: 6px; margin-top: 24px; }
        .paginacao a, .paginacao span {
            padding: 7px 13px; border-radius: 8px; font-size: 13px; text-decoration: none;
            border: 1px solid var(--borda); background: var(--branco); color: var(--texto-medio);
        }
        .paginacao a:hover { background: var(--verde-claro); border-color: var(--verde-medio); }
        .paginacao .atual { background: var(--verde); color: white; border-color: var(--verde); }

        /* Modal */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
        .overlay.aberto { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-titulo { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; color: var(--texto); margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; color: var(--texto); margin-bottom: 6px; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 10px 14px; border: 1.5px solid var(--borda); border-radius: 9px;
            font-size: 14px; font-family: 'Inter', sans-serif; outline: none; background: var(--fundo);
        }
        input:focus { border-color: var(--verde-medio); box-shadow: 0 0 0 3px rgba(20,184,166,0.12); }
        .modal-acoes { display: flex; gap: 10px; margin-top: 24px; }
        .btn-cancelar { background: #f3f4f6; color: var(--texto-medio); }
    </style>
</head>
<body>

<nav>
    <a href="/dashboard" class="nav-logo">Limpo<span>Tech</span></a>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/produtos" class="ativo">Produtos</a>
        <a href="/movimentacoes">Movimentações</a>
        <a href="/usuarios" sec:authorize="hasRole('ADMIN')">Usuários</a>
    </div>
    <div class="nav-usuario">
        <span th:text="${#authentication.name}">usuario@email.com</span>
        <a href="/login" class="btn-sair">Sair</a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <div class="page-title">Produtos</div>
        <button class="btn btn-primary" onclick="abrirModal()">+ Novo Produto</button>
    </div>

    <!-- Filtro por nome -->
    <form method="get" th:action="@{/produtos}">
        <div class="filtros">
            <input type="text" name="nome" placeholder="Buscar por nome do produto..."
                   th:value="${filtroNome}" />
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a href="/produtos" class="btn btn-cancelar btn-sm" style="padding:9px 14px;">Limpar</a>
        </div>
    </form>

    <div class="tabela-wrap">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nome do Produto</th>
                    <th>Quantidade em Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.id}">--</td>
                    <td th:text="${produto.nomeProduto}">--</td>
                    <td th:text="${produto.quantidadeProduto}"
                        th:classappend="${produto.quantidadeProduto <= 5} ? 'estoque-baixo' : ''">--</td>
                    <td>
                        <div class="acoes">


                            <button class="btn btn-primary btn-sm"
                                    th:data-id="${produto.id}"
                                    th:data-nome="${produto.nomeProduto}"
                                    th:data-quantidade="${produto.quantidadeProduto}"
                                    onclick="abrirModalEditar(
                                    this.dataset.id,
                                    this.dataset.nome,
                                    this.dataset.quantidade
                                )" sec:authorize="hasRole('ADMIN')">
                                Editar
                            </button>

                            <form th:action="@{/produtos/{id}(id=${produto.id})}" method="post"
                                  onsubmit="return confirm('Confirma a exclusão?')">
                                <input type="hidden" name="_method" value="DELETE" />
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit"
                                        class="btn btn-danger btn-sm"
                                        sec:authorize="hasRole('ADMIN')">
                                    Excluir
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produtos.content)}">
                    <td colspan="4" class="vazio">Nenhum produto encontrado.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginação -->
    <div class="paginacao" th:if="${produtos.totalPages > 1}">
        <a th:if="${!produtos.first}" th:href="@{/produtos(page=${produtos.number - 1}, nome=${filtroNome})}">← Anterior</a>
        <span th:each="i : ${#numbers.sequence(0, produtos.totalPages - 1)}"
              th:text="${i + 1}"
              th:classappend="${i == produtos.number} ? 'atual' : ''"
              th:attrappend="class=${i != produtos.number} ? '' : ''">
        </span>
        <a th:if="${!produtos.last}" th:href="@{/produtos(page=${produtos.number + 1}, nome=${filtroNome})}">Próxima →</a>
    </div>
</div>

<!-- Modal Novo / Editar Produto -->
<div class="overlay" id="overlay">
    <div class="modal">
        <div class="modal-titulo" id="modalTitulo">Novo Produto</div>
        <form id="formProduto" method="post" th:action="@{/produtos}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="_method" id="formMethod" value="POST" />
            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" name="nomeProduto" id="inputNome" placeholder="Ex: Detergente 500ml" required />
            </div>
            <div class="form-group">
                <label>Quantidade Inicial</label>
                <input type="number" name="quantidadeProduto" id="inputQtd" placeholder="0" min="0" required />
            </div>
            <div class="modal-acoes">
                <button type="button" class="btn btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary" style="flex:1">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script>
    function abrirModal() {
        document.getElementById('modalTitulo').textContent = 'Novo Produto';
        document.getElementById('formProduto').action = '/produtos';
        document.getElementById('formMethod').value = 'POST';
        document.getElementById('inputNome').value = '';
        document.getElementById('inputQtd').value = '';
        document.getElementById('overlay').classList.add('aberto');
    }

    function abrirModalEditar(id, nome, qtd) {
        document.getElementById('modalTitulo').textContent = 'Editar Produto';
        document.getElementById('formProduto').action = '/produtos/' + id;
        document.getElementById('formMethod').value = 'PUT';
        document.getElementById('inputNome').value = nome;
        document.getElementById('inputQtd').value = qtd;
        document.getElementById('overlay').classList.add('aberto');
    }

    function fecharModal() {
        document.getElementById('overlay').classList.remove('aberto');
    }

    document.getElementById('overlay').addEventListener('click', function(e) {
        if (e.target === this) fecharModal();
    });
</script>

</body>
</html>
