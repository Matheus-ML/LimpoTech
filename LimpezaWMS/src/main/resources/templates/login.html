<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LimpoTech — Acesso ao Sistema</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --verde-fundo:  #0d9488;
            --verde-escuro: #0f766e;
            --verde-claro:  #ccfbf1;
            --verde-medio:  #14b8a6;
            --branco:       #ffffff;
            --cinza-suave:  #f0fdfa;
            --texto-escuro: #134e4a;
            --texto-medio:  #374151;
            --erro:         #ef4444;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--verde-fundo) 0%, var(--verde-escuro) 60%, #065f46 100%);
            font-family: 'Inter', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.04) 0%, transparent 40%);
            pointer-events: none;
        }

        .card {
            background: var(--branco);
            border-radius: 20px;
            padding: 48px 44px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(13, 148, 136, 0.25);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 24px; right: 24px;
            height: 3px;
            background: linear-gradient(90deg, var(--verde-medio), var(--verde-claro));
            border-radius: 0 0 4px 4px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icone {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--verde-fundo), var(--verde-escuro));
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(13, 148, 136, 0.35);
        }

        .logo-icone svg { width: 28px; height: 28px; fill: white; }

        .logo-nome {
            font-family: 'Sora', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--texto-escuro);
            letter-spacing: -0.5px;
        }

        .logo-nome span { color: var(--verde-fundo); }

        .logo-subtitulo {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--texto-escuro);
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #d1fae5;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--texto-medio);
            background: var(--cinza-suave);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--verde-medio);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
            background: var(--branco);
        }

        input::placeholder { color: #9ca3af; }

        .btn-entrar {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--verde-fundo), var(--verde-escuro));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-entrar:hover  { opacity: 0.92; transform: translateY(-1px); }
        .btn-entrar:active { transform: translateY(0); }

        /* Mensagem de feedback (erro ou saída) */
        .msg {
            display: none;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .msg.erro {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-left: 3px solid var(--erro);
            color: #b91c1c;
        }

        .msg.info {
            display: block;
            background: var(--cinza-suave);
            border: 1px solid var(--verde-claro);
            border-left: 3px solid var(--verde-medio);
            color: var(--texto-escuro);
        }

        .rodape {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="logo-area">
        <div class="logo-icone">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 8a1 1 0 0 0-.5-.87l-8-4.5a1 1 0 0 0-1 0l-8 4.5A1 1 0 0 0 3 8v8a1 1 0 0 0 .5.87l8 4.5a1 1 0 0 0 1 0l8-4.5A1 1 0 0 0 21 16ZM12 4.14 18.06 7.5 12 10.86 5.94 7.5ZM5 9.28l6 3.37V19.6l-6-3.37Zm8 10.32V12.65l6-3.37v6.95Z"/>
            </svg>
        </div>
        <div class="logo-nome">Limpo<span>Tech</span></div>
        <div class="logo-subtitulo">Sistema de Gestão de Almoxarifado</div>
    </div>

    <!-- Mensagem vinda do controller via Thymeleaf -->
    <div th:if="${mensagem}" th:text="${mensagem}"
         th:classappend="${param.erro != null} ? 'msg erro' : 'msg info'"
         class="msg">
    </div>

    <!--
        O Spring Security intercepta o POST /login automaticamente.
        Os campos DEVEM se chamar "username" e "password".
        Usamos "username" para o e-mail pois é o que o Spring espera por padrão.
    -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label for="username">E-mail</label>
            <input type="text" id="username" name="username"
                   placeholder="seu@email.com" required autocomplete="username" />
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    <div class="rodape">LimpoTech WMS &copy; 2025</div>
</div>

</body>
</html>
